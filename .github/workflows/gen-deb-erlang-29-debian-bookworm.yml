name: Build Erlang 29 for Debian Bookworm

on:
  workflow_dispatch:
    inputs:
      erlang_tag:
        description: "Erlang OTP tag (e.g. OTP-27.3.4.6)"
        required: true
        type: string
        default: "OTP-27.3.4.6"
  repository_dispatch:
    types: [new_erlang_29_release]

jobs:
  call-reusable-workflow:
    uses: rabbitmq/erlang-packages/.github/workflows/gen-deb-erlang-reusable-workflow.yml@main
    with:
      erlang_tag: ${{ inputs.erlang_tag != '' && inputs.erlang_tag || github.event.client_payload.tag }}
      erlang_major: "29"
      distribution_name: "debian"
      distribution_codename: "bookworm"
      distribution_version: "bookworm"
      ppa_repository: "rabbitmq-erlang-29"
      publish_to_package_repos: "true"
      publish_to_launchpad: "true"
    secrets: inherit
